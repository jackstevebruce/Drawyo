<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#121216" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#2C2C35" stroke-width="3" />
  
  <!-- Smooth Curved Ribbon Line -->
  <path d="M 28 88 C 45 40, 75 110, 100 48" fill="none" stroke="#3E3E4C" stroke-width="6" stroke-linecap="round" />
  <path d="M 28 88 C 45 40, 75 110, 100 48" fill="none" stroke="url(#penGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 10" />

  <!-- Pen Stylus Body -->
  <g transform="translate(64,64) rotate(-45) translate(-64,-64)">
    <path d="M 56 24 L 72 24 L 72 80 L 64 98 L 56 80 Z" fill="#EAEAEA" />
    <path d="M 64 24 L 72 24 L 72 80 L 64 98 Z" fill="#D0D0D8" />
    <!-- Nib Tip -->
    <path d="M 61 92 L 67 92 L 64 98 Z" fill="#00E676" />
    <!-- Accent Ring -->
    <rect x="56" y="44" width="16" height="6" fill="#00E676" />
    <!-- Stylus Cap -->
    <path d="M 56 24 L 72 24 L 70 18 L 58 18 Z" fill="#33333D" />
  </g>

  <!-- Glowing Glow Point at Nib -->
  <circle cx="88" cy="40" r="5" fill="#00E676" />
  <circle cx="88" cy="40" r="9" fill="#00E676" opacity="0.3" />
</svg>
